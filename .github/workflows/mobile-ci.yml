name: LifeOS Mobile CI

on:
  push:
    branches:
      - feature/mobile-kmp-integration
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile-ci.yml'
  pull_request:
    branches:
      - main
      - feature/mobile-kmp-integration
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile-ci.yml'

permissions:
  contents: read

jobs:
  mobile-lint-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Validate Gradle wrapper and scripts
        run: |
          echo "Verifying mobile multiplatform structure..."
          test -d mobile/shared
          test -d mobile/androidApp
          test -d mobile/iosApp
          echo "Mobile project directories validated successfully."
