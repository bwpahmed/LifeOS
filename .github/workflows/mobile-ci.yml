name: LifeOS Mobile CI

on:
  push:
    branches:
      - feature/mobile-kmp-integration
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile-ci.yml'
  pull_request:
    branches:
      - main
      - feature/mobile-kmp-integration
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile-ci.yml'

permissions:
  contents: read

jobs:
  build-android-and-kmp:
    name: KMP Core & Android Build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Compile KMP Shared Module
        run: |
          cd mobile
          chmod +x gradlew 2>/dev/null || true
          gradle :shared:assemble

      - name: Build Android Debug APK
        run: |
          cd mobile
          gradle :androidApp:assembleDebug

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: lifeos-android-debug-apk
          path: mobile/androidApp/build/outputs/apk/debug/androidApp-debug.apk

  build-ios:
    name: iOS App & Swift Build
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.app/Contents/Developer || true

      - name: Verify iOS Project Structure
        run: |
          test -f mobile/iosApp/LifeOSApp.xcodeproj/project.pbxproj
          test -f mobile/iosApp/LifeOSApp/LifeOSApp.swift
          test -f mobile/iosApp/LifeOSApp/ContentView.swift
          echo "iOS project files verified successfully."

      - name: Build iOS App with xcodebuild
        run: |
          cd mobile/iosApp
          xcodebuild -project LifeOSApp.xcodeproj \
                     -scheme LifeOSApp \
                     -sdk iphonesimulator \
                     -destination 'platform=iOS Simulator,name=iPhone 16' \
                     clean build \
                     CODE_SIGNING_ALLOWED=NO \
                     CODE_SIGNING_REQUIRED=NO
